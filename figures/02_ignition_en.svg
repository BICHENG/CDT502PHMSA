  <g id="text_18">
   <text style="font-size: 13.5px; font-family: 'Arial', 'Microsoft YaHei', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #5e6d76" x="34.56" y="71.848" transform="rotate(-0 34.56 71.848)">Public property: 45 service-line and 363 main reports. Ignition was recorded in 73.3% and 36.1%, respectively.</text>
