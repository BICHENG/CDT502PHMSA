  <g id="text_24">
   <text style="font-weight: 700; font-size: 24px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #26353e" x="34.56" y="46.434" transform="rotate(-0 34.56 46.434)">按里程与年数换算，铸铁／锻铁相关的伤亡报告率较高</text>
  </g>
  <g id="text_25">
   <text style="font-size: 13.5px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; text-anchor: start; fill: #5e6d76" x="34.56" y="86.651274" transform="rotate(-0 34.56 86.651274)">2010–2024 年主管道及主管道阀：693 份事故，其中 141 份伴随伤亡。</text>
  </g>
  <g id="text_26">
   <text style="font-size: 11px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; fill: #5e6d76" transform="translate(34.56 532.674359)">横线为按辖区共同重抽样的 95% 区间。用年末里程近似该年的在用规模，再逐年相加。</text>
   <text style="font-size: 11px; font-family: 'Microsoft YaHei', 'Arial', 'DejaVu Sans', sans-serif; fill: #5e6d76" transform="translate(34.56 551.425922)">铸铁／锻铁的分母采用同类材料里程；钢与塑料使用各自对应的里程。</text>
  </g>
